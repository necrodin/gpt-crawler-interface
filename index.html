<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT Crawler - Web Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 2rem;
        }
        .btn-primary {
            background: #6366f1;
            color: white;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
        .status-log {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .download-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .nav-tabs {
            border-bottom: 2px solid #e5e7eb;
        }
        .nav-tab {
            padding: 0.75rem 1.5rem;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-tab.active {
            border-bottom-color: #6366f1;
            color: #6366f1;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">
                <i class="fas fa-web mr-3"></i>GPT Crawler Interface
            </h1>
            <p class="text-blue-100">Crawl your website and generate information files</p>
        </div>

        <div class="card">
            <div class="nav-tabs flex space-x-4 mb-6">
                <div class="nav-tab active" onclick="switchTab('crawl')">
                    <i class="fas fa-search mr-2"></i>Start Crawl
                </div>
                <div class="nav-tab" onclick="switchTab('settings')">
                    <i class="fas fa-cog mr-2"></i>Settings
                </div>
            </div>

            <div id="crawl-tab">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">
                            <i class="fas fa-globe mr-2"></i>Start URL
                        </label>
                        <input type="url" id="url" class="form-input w-full border border-gray-300 rounded px-3 py-2" 
                               placeholder="https://example.com" style="font-size: 0.85rem;">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">
                            <i class="fas fa-filter mr-2"></i>Match Pattern
                        </label>
                        <input type="text" id="match" class="form-input w-full border border-gray-300 rounded px-3 py-2" 
                               placeholder="https://example.com/**" style="font-size: 0.85rem;">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">
                            <i class="fas fa-crosshairs mr-2"></i>Selector
                        </label>
                        <input type="text" id="selector" class="form-input w-full border border-gray-300 rounded px-3 py-2" 
                               value="body">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">
                            <i class="fas fa-file-code mr-2"></i>Output File
                        </label>
                        <input type="text" id="outputFileName" class="form-input w-full border border-gray-300 rounded px-3 py-2" 
                               value="" placeholder="output.json (auto-named by domain)" style="font-size: 0.85rem;">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">
                            <i class="fas fa-maximize mr-2"></i>Max Pages
                        </label>
                        <input type="number" id="maxPages" class="form-input w-full border border-gray-300 rounded px-3 py-2" 
                               value="5" min="1">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">
                            <i class="fas fa-clock mr-2"></i>Timeout (ms)
                        </label>
                        <input type="number" id="timeout" class="form-input w-full border border-gray-300 rounded px-3 py-2" 
                               value="20000">
                    </div>
                </div>

                <div class="flex items-center gap-4 mb-6">
                    <button id="startBtn" class="btn-primary px-8 py-3 rounded-lg font-bold">
                        <i class="fas fa-play mr-2"></i>Start Crawl
                    </button>
                    <div id="statusBadge" class="badge bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm">
                        <i class="fas fa-minus-circle mr-2"></i>Waiting
                    </div>
                </div>

                <div id="loader" class="loader"></div>

                <div class="mt-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">
                        <i class="fas fa-terminal mr-2"></i>Status Log
                    </label>
                    <div id="status-log" class="status-log">
                        <div class="text-gray-400">
                            <i class="fas fa-info-circle mr-2"></i>Enter URL and settings, then click "Start Crawl" button
                        </div>
                    </div>
                </div>

                <div id="results" class="hidden mt-6 border-t pt-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-download mr-2"></i>Results
                    </h2>
                    <div class="flex flex-col md:flex-row gap-4">
                        <button id="downloadJsonBtn" class="download-btn flex-1 px-6 py-3 rounded-lg font-bold">
                            <i class="fas fa-download mr-2"></i>Download JSON
                        </button>
                        <button id="downloadMdBtn" class="btn-primary flex-1 px-6 py-3 rounded-lg font-bold">
                            <i class="fab fa-markdown mr-2"></i>Convert to Markdown
                        </button>
                    </div>
                    <p id="outputPathText" class="text-gray-600 text-sm mt-4 truncate">
                        Output: -
                    </p>
                </div>
            </div>

            <div id="settings-tab" class="hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">
                            Default Max Pages
                        </label>
                        <input type="number" id="defaultMaxPages" class="form-input w-full border border-gray-300 rounded px-3 py-2" 
                               value="50">
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-8 text-blue-100">
            <p class="text-sm">Powered by GPT Crawler</p>
        </div>
    </div>

    <script src="./ui.js"></script>
</body>
</html>
